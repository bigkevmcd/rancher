---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: oidcclients.management.cattle.io
spec:
  group: management.cattle.io
  names:
    kind: OIDCClient
    listKind: OIDCClientList
    plural: oidcclients
    singular: oidcclient
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.clientID
      name: Client ID
      type: string
    - jsonPath: .spec.tokenExpirationSeconds
      name: Token Expiration
      type: integer
    - jsonPath: .spec.refreshTokenExpirationSeconds
      name: RefreshToken Expiration
      type: integer
    name: v3
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the specification of the desired configuration for
              the oidc client.
            properties:
              backchannel:
                description: |-
                  Backchannel enables the client for Client-Initiated Backchannel Authentication (CIBA),
                  by which an agent asks a user to approve access for it, and receives an agent token once
                  the user approved. Without it the client can't make backchannel requests.
                properties:
                  agentName:
                    description: |-
                      AgentName identifies the agent in audit records and must be a valid DNS label. It defaults
                      to the name of the client.
                    type: string
                  requestExpirationSeconds:
                    default: 120
                    description: |-
                      RequestExpirationSeconds is how long a user has to approve a request, unless the client asks
                      for less. It can't be more than 600.
                    format: int64
                    maximum: 600
                    minimum: 1
                    type: integer
                  scopes:
                    description: |-
                      Scopes are the scopes the client may request. A scope is a name for a set of rules, which
                      limit the agent token issued if the user approves. The user sees the names and the rules
                      when asked to approve.
                    items:
                      description: OIDCClientBackchannelScope names a set of rules
                        for backchannel requests.
                      properties:
                        description:
                          description: Description is shown to the user who approves.
                          type: string
                        name:
                          description: Name is the scope as requested, e.g. "read-deployments".
                            It must not contain spaces.
                          pattern: ^[^\s]+$
                          type: string
                        rules:
                          description: Rules limit the agent token, see AgentRule.
                          items:
                            description: |-
                              AgentRule is a restricted form of an RBAC policy rule, which limits what an agent may do. Resource
                              names and non-resource URLs are not supported.
                            properties:
                              apiGroups:
                                description: |-
                                  APIGroups is the list of API groups of the allowed resources. The empty string is the core
                                  group. "*" matches all groups.
                                items:
                                  type: string
                                minItems: 1
                                type: array
                              resources:
                                description: |-
                                  Resources is the list of allowed resources, optionally with a subresource such as "pods/log".
                                  "*" matches all resources.
                                items:
                                  type: string
                                minItems: 1
                                type: array
                              verbs:
                                description: |-
                                  Verbs is the list of allowed verbs, e.g. get, list, watch, create, update, patch, delete.
                                  "*" matches all verbs.
                                items:
                                  type: string
                                minItems: 1
                                type: array
                            required:
                            - apiGroups
                            - resources
                            - verbs
                            type: object
                          minItems: 1
                          type: array
                      required:
                      - name
                      - rules
                      type: object
                    minItems: 1
                    type: array
                  tokenExpirationSeconds:
                    default: 3600
                    description: |-
                      TokenExpirationSeconds is the lifetime of the agent tokens issued. It is limited by the
                      agent-token-max-ttl-minutes setting.
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - scopes
                type: object
              description:
                description: Description provides additional context about the OIDC
                  client.
                type: string
              redirectURIs:
                description: |-
                  RedirectURIs defines the allowed redirect URIs for the OIDC client.
                  These URIs must be registered and used during the authentication flow.
                items:
                  type: string
                type: array
              refreshTokenExpirationSeconds:
                default: 86400
                description: |-
                  RefreshTokenExpirationSeconds defines how long (in seconds)
                  a refresh token remains valid before expiration.
                format: int64
                minimum: 1
                type: integer
              scopes:
                description: |-
                  Scopes is the list of scopes allowed for this client.

                  If configured, the client will only be able to request these scopes.
                items:
                  type: string
                type: array
              tokenExpirationSeconds:
                default: 3600
                description: |-
                  TokenExpirationSeconds specifies the duration (in seconds) before
                  an access token and ID token expire.
                format: int64
                minimum: 1
                type: integer
            required:
            - refreshTokenExpirationSeconds
            - tokenExpirationSeconds
            type: object
          status:
            description: Status is the most recently observed status of the oidc client.
            properties:
              clientID:
                description: ClientID represents the ID of the client
                type: string
              clientSecrets:
                additionalProperties:
                  description: OIDCClientSecretStatus represent the observed status
                    of a client secret.
                  properties:
                    createdAt:
                      description: CreatedAt represents when this client secret was
                        created.
                      type: string
                    lastFiveCharacters:
                      description: LastFiveCharacters are the 5 last characters of
                        the client secret
                      type: string
                    lastUsedAt:
                      description: LastUsedAt represent when this client secret was
                        used.
                      type: string
                  type: object
                description: ClientSecrets represents the observed status of the client
                  secrets
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
